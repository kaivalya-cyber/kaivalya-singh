name: Refresh 3D contribution graph

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contrib SVG
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kaivalya-cyber
          SETTING_JSON: scripts/3d-contrib-settings.json

      - name: Move SVG into public/
        run: cp profile-3d-contrib/profile-amber.svg public/github-3d-contrib.svg

      - name: Commit & push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add public/github-3d-contrib.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh 3d contribution graph"
            git push
          fi
