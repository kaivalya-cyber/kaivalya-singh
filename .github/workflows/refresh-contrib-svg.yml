name: Refresh contribution data

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contrib SVG
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kaivalya-cyber
          SETTING_JSON: scripts/3d-contrib-settings.json

      - name: Move SVG into public/ & theme the language pie
        run: |
          cp profile-3d-contrib/profile-amber.svg public/github-3d-contrib.svg
          node scripts/theme-contrib-svg.mjs public/github-3d-contrib.svg

      - name: Fetch upstream PR stats + calendar JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:github

      - name: Fetch flagship repo telemetry (languages, commits, activity)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:repos

      - name: Commit & push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add public/github-3d-contrib.svg content/github-contributions.json content/github-repos.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "refresh contribution data (3d graph + upstream pr stats)"
            git push
          fi
