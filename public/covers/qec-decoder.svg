  <!-- checker field -->
  <g transform="rotate(-8 260 420)">
    <rect x="60"  y="330" width="80" height="80" fill="#A48FD8" fill-opacity="0.16"/>
    <rect x="148" y="330" width="80" height="80" fill="#A48FD8" fill-opacity="0.45"/>
    <rect x="236" y="330" width="80" height="80" fill="#A48FD8" fill-opacity="0.16"/>
