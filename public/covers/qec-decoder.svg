<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Quantum syndrome lattice poster in muted violet">
  <defs>
    <pattern id="qec-lat" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="32" height="32" fill="none" stroke="#26221A" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="#14120D"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#26221A" stroke-width="1.5"/>
  <text x="560" y="240" text-anchor="end" font-family="ui-monospace, monospace" font-size="260" font-weight="bold" fill="#1A1712">02</text>
  <!-- lattice -->
  <rect x="72" y="168" width="408" height="336" fill="url(#qec-lat)"/>
  <!-- error cells -->
  <rect x="216" y="264" width="32" height="32" fill="#F47067"/>
  <rect x="360" y="216" width="32" height="32" fill="#F47067"/>
  <rect x="264" y="408" width="32" height="32" fill="#F47067"/>
  <!-- logical operator path -->
  <polyline points="88,232 232,232 232,184 376,184 376,280 424,280 424,424 184,424 184,376 280,376"
    fill="none" stroke="#A48FD8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- callout -->
  <text x="72" y="96" font-family="ui-monospace, monospace" font-size="18" fill="#8F887A">LER ↓</text>
  <text x="152" y="96" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#A48FD8">18.4%</text>
  <text x="72" y="124" font-family="ui-monospace, monospace" font-size="14" fill="#8F887A">27.2% peak · classifier 94.2% · overhead 3.8%</text>
  <!-- caption -->
  <text x="72" y="556" font-family="ui-monospace, monospace" font-size="15" fill="#8F887A">fig. 02 — syndrome classification → variational decode</text>
</svg>
