  <rect x="486" y="300" width="52" height="52" fill="#F47067"/>
  <!-- type -->
  <text x="56" y="88" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#8F887A">FIG. 02 — VARIATIONAL QEC</text>
  <text x="56" y="184" font-family="ui-monospace, monospace" font-size="96" font-weight="bold" fill="#A48FD8">−18.4%</text>
  <text x="56" y="218" font-family="ui-monospace, monospace" font-size="17" letter-spacing="3" fill="#D8D2C4">LOGICAL ERROR RATE</text>
  <text x="56" y="250" font-family="ui-monospace, monospace" font-size="13" fill="#8F887A">27.2% PEAK · CLASSIFIER 94.2% · OVERHEAD 3.8%</text>
  <text x="568" y="568" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#8F887A">SYNDROME ROUTING → VARIATIONAL DECODE</text>
