  <!-- swing arcs -->
  <path d="M 420 90 Q 230 260 258 470" fill="none" stroke="#8F887A" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 10"/>
  <path d="M 434 112 Q 300 280 312 458" fill="none" stroke="#8F887A" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="2 10"/>
