  <circle cx="360" cy="360" r="11" fill="#14120D" stroke="#D8D2C4" stroke-width="3"/>
  <circle cx="290" cy="470" r="11" fill="#14120D" stroke="#D8D2C4" stroke-width="3"/>
  <!-- giant bob -->
  <circle cx="200" cy="560" r="150" fill="#D29922"/>
  <circle cx="200" cy="560" r="178" fill="none" stroke="#D29922" stroke-opacity="0.35" stroke-width="2"/>
