  <text x="56" y="88" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#8F887A">FIG. 01 — REWARD SHAPING</text>
  <text x="56" y="182" font-family="ui-monospace, monospace" font-size="100" font-weight="bold" fill="#D8D2C4">0.515</text>
