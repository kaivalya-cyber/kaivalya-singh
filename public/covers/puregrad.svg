<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Coral poster: autograd graph with a bold backward pass">
  <defs>
    <marker id="pg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#F47067"/>
    </marker>
  </defs>
  <rect width="600" height="600" fill="#14120D"/>
  <text x="628" y="252" text-anchor="end" font-family="ui-monospace, monospace" font-size="300" font-weight="bold" fill="none" stroke="#F47067" stroke-opacity="0.22" stroke-width="2">04</text>
  <!-- forward rails -->
  <g stroke="#26221A" stroke-width="18" stroke-linecap="round">
    <line x1="140" y1="470" x2="276" y2="384"/>
    <line x1="284" y1="374" x2="404" y2="288"/>
    <line x1="412" y1="278" x2="490" y2="196"/>
  </g>
  <!-- backward pass band -->
  <g fill="none" stroke="#F47067" stroke-width="3.5" stroke-dasharray="12 12">
    <path d="M 470 150 C 380 220 300 290 200 380" marker-end="url(#pg-arrow)"/>
    <path d="M 512 196 C 420 268 340 336 238 428" marker-end="url(#pg-arrow)"/>
  </g>
  <!-- nodes -->
  <circle cx="132" cy="482" r="34" fill="#14120D" stroke="#8F887A" stroke-width="4"/>
  <circle cx="276" cy="380" r="34" fill="#14120D" stroke="#D8D2C4" stroke-width="4"/>
  <circle cx="408" cy="284" r="34" fill="#14120D" stroke="#D8D2C4" stroke-width="4"/>
  <circle cx="498" cy="186" r="50" fill="#F47067"/>
  <text x="498" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#14120D">L</text>
  <text x="150" y="196" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#F47067" transform="rotate(-33 150 196)">∂L/∂w</text>
  <!-- type -->
  <text x="56" y="88" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#8F887A">FIG. 04 — PUREGRAD</text>
  <text x="56" y="184" font-family="ui-monospace, monospace" font-size="96" font-weight="bold" fill="#F47067">99.7%</text>
  <text x="56" y="218" font-family="ui-monospace, monospace" font-size="17" letter-spacing="3" fill="#D8D2C4">MOONS ACCURACY · 19/19 TESTS</text>
  <text x="56" y="250" font-family="ui-monospace, monospace" font-size="13" fill="#8F887A">PURE PYTHON + NUMPY · DYNAMIC GRAPH · NUMERICAL CHECKER</text>
  <text x="568" y="568" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2" fill="#8F887A">REVERSE-MODE AUTODIFF, FROM SCRATCH</text>
</svg>
