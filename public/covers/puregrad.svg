<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Autograd computation graph with forward arrows and a dashed backward pass">
  <defs>
    <marker id="pg-fwd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8F887A"/>
    </marker>
    <marker id="pg-bwd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M8 0 L0 4 L8 8 z" fill="#F47067"/>
    </marker>
  </defs>
  <rect width="600" height="600" fill="#14120D"/>
  <!-- headline -->
  <text x="56" y="84" font-family="ui-monospace, monospace" font-size="22" fill="#D8D2C4">99.7% moons accuracy</text>
  <text x="56" y="110" font-family="ui-monospace, monospace" font-size="14" fill="#8F887A">19/19 tests · numerical gradient checker</text>
  <!-- forward edges -->
  <line x1="146" y1="430" x2="238" y2="360" stroke="#8F887A" stroke-width="2" marker-end="url(#pg-fwd)"/>
  <line x1="292" y1="350" x2="368" y2="300" stroke="#8F887A" stroke-width="2" marker-end="url(#pg-fwd)"/>
  <line x1="422" y1="290" x2="482" y2="220" stroke="#8F887A" stroke-width="2" marker-end="url(#pg-fwd)"/>
  <line x1="480" y1="180" x2="420" y2="130" stroke="#8F887A" stroke-width="2" marker-end="url(#pg-fwd)"/>
  <!-- backward edges (dashed, coral) -->
  <path d="M 400 122 C 460 160 500 190 492 172" fill="none" stroke="#F47067" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#pg-bwd)"/>
  <line x1="470" y1="238" x2="430" y2="282" stroke="#F47067" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#pg-bwd)"/>
  <line x1="356" y1="312" x2="302" y2="360" stroke="#F47067" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#pg-bwd)"/>
  <line x1="228" y1="372" x2="156" y2="424" stroke="#F47067" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#pg-bwd)"/>
  <!-- nodes -->
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <circle cx="130" cy="440" r="26" fill="#16140F" stroke="#2A261E" stroke-width="2.5"/>
    <text x="130" y="445" font-size="13" fill="#8F887A">x·w</text>
    <circle cx="280" cy="352" r="26" fill="#16140F" stroke="#D8B478" stroke-width="2.5"/>
    <text x="280" y="357" font-size="13" fill="#D8B478">+b</text>
    <circle cx="400" cy="288" r="26" fill="#16140F" stroke="#D8B478" stroke-width="2.5"/>
    <text x="400" y="293" font-size="13" fill="#D8B478">σ</text>
    <circle cx="498" cy="196" r="26" fill="#16140F" stroke="#D29922" stroke-width="2.5"/>
    <text x="498" y="201" font-size="13" fill="#D29922">L</text>
    <circle cx="400" cy="118" r="22" fill="#16140F" stroke="#F47067" stroke-width="2.5"/>
    <text x="400" y="123" font-size="13" fill="#F47067">∂L</text>
  </g>
  <!-- pass labels -->
  <text x="80" y="180" font-family="ui-monospace, monospace" font-size="13" fill="#F47067">← backward: ∂L/∂w</text>
  <text x="80" y="205" font-family="ui-monospace, monospace" font-size="13" fill="#8F887A">forward: build the graph →</text>
  <!-- caption -->
  <text x="56" y="556" font-family="ui-monospace, monospace" font-size="15" fill="#8F887A">fig. 04 — pure Python + NumPy autograd, graph visualizer built in</text>
</svg>
